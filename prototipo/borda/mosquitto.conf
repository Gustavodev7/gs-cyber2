# Broker MQTT local da borda com mTLS (RT-04). Sem certificado valido, sem conexao.
# Recarrega a CRL com: docker compose kill -s HUP mosquitto
# Atencao: o Mosquitto NAO aceita comentario no fim da linha; comentar sempre
# em linha propria.

per_listener_settings false

listener 8883
protocol mqtt

# TLS mutuo: o broker apresenta o proprio certificado e EXIGE o do cliente.
cafile   /pki/ca.cert.pem
certfile /pki/mosquitto.cert.pem
keyfile  /pki/mosquitto.key.pem
require_certificate true
tls_version tlsv1.2

# O CN do certificado do cliente vira o usuario (base da autorizacao por ACL).
use_identity_as_username true

# Certificado revogado e recusado (RT-05).
crlfile  /pki/crl.pem

# Sem acesso anonimo. Autorizacao por ACL ligada a identidade do certificado.
allow_anonymous false
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Logs para o SIEM (RT-12/RT-13c): erros de TLS (certificado invalido/revogado)
# aparecem como "error"; conexoes e desconexoes como "notice"/"information".
log_dest stdout
log_dest file /var/log/vila/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
