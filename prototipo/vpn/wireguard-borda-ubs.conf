# VPN borda <-> nuvem com WireGuard (RT-06). Cifras modernas (Curve25519,
# ChaCha20-Poly1305). Acesso administrativo so passa por aqui; nenhuma porta
# administrativa exposta a internet (RT-06).
#
# As chaves abaixo sao PLACEHOLDERS. Gerar de verdade no lab e NAO versionar:
#   wg genkey | tee borda-ubs.key | wg pubkey > borda-ubs.pub
# Guardar a chave privada so no dispositivo (ver .gitignore).

[Interface]
# Endereco do no de borda no tunel (segmento IoT/borda)
Address = 10.8.2.11/32
PrivateKey = <PREENCHER_NO_LAB_NAO_VERSIONAR>
# DNS interno opcional
# DNS = 10.8.0.2

[Peer]
# Concentrador na nuvem/servidor do lab
PublicKey = <CHAVE_PUBLICA_DO_CONCENTRADOR>
Endpoint = concentrador.vila-aurora.lab:51820
# So o segmento de servicos da nuvem e alcancavel pela borda (menor privilegio / RT-07)
AllowedIPs = 10.8.0.0/24
PersistentKeepalive = 25
