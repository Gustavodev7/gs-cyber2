# Ambiente do prototipo Vila Aurora (E2). Dados sinteticos apenas.
#
# Segmentacao (RT-07): cada rede e um segmento. Um servico so enxerga os
# segmentos de que precisa (menor privilegio):
#   iot         sensores <-> broker MQTT local <-> no de borda
#   wan         no de borda <-> ingestao na nuvem (o "link de internet"; o teste
#               de caos derruba esta rede com `docker network disconnect`)
#   dados       banco <-> painel / ingestao   (internal: sem saida externa)
#   operadores  WAF <-> painel               (unica entrada dos operadores)
#   admin       SIEM                          (internal)
# Portas publicadas SO no loopback do host (127.0.0.1). Acesso remoto: VPN
# WireGuard + MFA no painel (RT-06). Segredos vem do .env (nao versionado).
#
# Subir tudo:  bash scripts/subir_lab.sh
# Versao vulneravel (so para a demo de SQLi):
#   docker compose --profile vulneravel up -d painel-vulneravel
# SIEM:        docker compose --profile siem up -d wazuh && bash siem/configurar_wazuh.sh

services:
  # ------------------------------------------------------------------ dados
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: vila
      POSTGRES_USER: vila_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?defina no .env}
      PAINEL_RO_PASSWORD: ${PAINEL_RO_PASSWORD:?defina no .env}
      INGEST_PASSWORD: ${INGEST_PASSWORD:?defina no .env}
      TZ: UTC
    # Logs do banco para o SIEM e para a forense (RT-12): conexoes, instrucoes e
    # toda instrucao que falhar (o sqlmap gera muitas). Arquivo em ./logs/postgres/.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/vila/postgres
      - -c
      - log_filename=postgresql.log
      - -c
      - log_file_mode=0644
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=all
      - -c
      - log_min_error_statement=error
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d client=%h app=%a "
    volumes:
      - ./nuvem/painel/initdb/05-roles.sql:/docker-entrypoint-initdb.d/05-roles.sql:ro
      - ./nuvem/painel/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
      - ./logs:/var/log/vila
    networks: [dados]

  # ------------------------------------------------------------- campo/borda
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    environment:
      TZ: UTC
    volumes:
      - ./borda/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./borda/acl:/mosquitto/config/acl:ro
      # o broker recebe so o que precisa: CA, CRL e o PROPRIO par de chaves
      - ./pki/ca/ca.cert.pem:/pki/ca.cert.pem:ro
      - ./pki/crl/vila-aurora.crl.pem:/pki/crl.pem:ro
      - ./pki/certs/mosquitto.cert.pem:/pki/mosquitto.cert.pem:ro
      - ./pki/private/mosquitto.key.pem:/pki/mosquitto.key.pem:ro
      - ./logs:/var/log/vila
    networks: [iot]
    ports:
      - "127.0.0.1:8883:8883"   # para testar do host (certificado valido x revogado)

  sensor-ubs-geladeira:
    build: ./dispositivos
    command: ["python", "sensor.py", "ubs-geladeira", "ubs", "ambiente"]
    environment: &sensor_env
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      PKI_DIR: /pki
      LOG_DIR: /var/log/vila
      TZ: UTC
    volumes:
      # cada dispositivo recebe so o proprio certificado e a propria chave
      - ./pki/ca/ca.cert.pem:/pki/ca/ca.cert.pem:ro
      - ./pki/certs/ubs-geladeira.cert.pem:/pki/certs/ubs-geladeira.cert.pem:ro
      - ./pki/private/ubs-geladeira.key.pem:/pki/private/ubs-geladeira.key.pem:ro
      - ./logs:/var/log/vila
    depends_on: [mosquitto]
    networks: [iot]

  sensor-escola-nivel:
    build: ./dispositivos
    command: ["python", "sensor.py", "escola-nivel", "escola", "agua"]
    environment: *sensor_env
    volumes:
      - ./pki/ca/ca.cert.pem:/pki/ca/ca.cert.pem:ro
      - ./pki/certs/escola-nivel.cert.pem:/pki/certs/escola-nivel.cert.pem:ro
      - ./pki/private/escola-nivel.key.pem:/pki/private/escola-nivel.key.pem:ro
      - ./logs:/var/log/vila
    depends_on: [mosquitto]
    networks: [iot]

  sensor-abrigo-alagamento:
    build: ./dispositivos
    command: ["python", "sensor.py", "abrigo-alagamento", "abrigo", "ambiente"]
    environment: *sensor_env
    volumes:
      - ./pki/ca/ca.cert.pem:/pki/ca/ca.cert.pem:ro
      - ./pki/certs/abrigo-alagamento.cert.pem:/pki/certs/abrigo-alagamento.cert.pem:ro
      - ./pki/private/abrigo-alagamento.key.pem:/pki/private/abrigo-alagamento.key.pem:ro
      - ./logs:/var/log/vila
    depends_on: [mosquitto]
    networks: [iot]

  borda:
    build: ./borda
    environment:
      BORDA_NOME: borda-ubs
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      NUVEM_URL: https://ingest:8443/ingest
      PKI_DIR: /pki
      BORDA_BUFFER: /dados/buffer.db
      LOG_DIR: /var/log/vila
      TZ: UTC
    volumes:
      - ./pki/ca/ca.cert.pem:/pki/ca/ca.cert.pem:ro
      - ./pki/certs/borda-ubs.cert.pem:/pki/certs/borda-ubs.cert.pem:ro
      - ./pki/private/borda-ubs.key.pem:/pki/private/borda-ubs.key.pem:ro
      - borda_buffer:/dados
      - ./logs:/var/log/vila
    depends_on: [mosquitto, ingest]
    networks: [iot, wan]

  # ------------------------------------------------------------------ nuvem
  # Ingestao HTTPS com mTLS (RT-04): so aceita no de borda com certificado da CA
  # do projeto, nao revogado (CRL) e com CN borda-*.
  ingest:
    build: ./nuvem/ingest
    environment:
      INGEST_DB_DSN: "postgresql://ingest_w:${INGEST_PASSWORD}@postgres:5432/vila"
      LOG_DIR: /var/log/vila
      TZ: UTC
    volumes:
      - ./pki/ca/ca.cert.pem:/pki/ca.cert.pem:ro
      - ./pki/crl/vila-aurora.crl.pem:/pki/crl.pem:ro
      - ./pki/certs/ingest.cert.pem:/pki/ingest.cert.pem:ro
      - ./pki/private/ingest.key.pem:/pki/ingest.key.pem:ro
      - ./logs:/var/log/vila
    depends_on: [postgres]
    networks: [wan, dados]

  painel:
    build: ./nuvem/painel
    environment:
      PAINEL_SECRET: ${PAINEL_SECRET:?defina no .env}
      PAINEL_DB_DSN: "postgresql://painel_ro:${PAINEL_RO_PASSWORD}@postgres:5432/vila"
      PAINEL_LOG: /var/log/vila/painel.json
      TZ: UTC
    volumes:
      - ./logs:/var/log/vila
    depends_on: [postgres]
    networks: [dados, operadores]
    ports:
      # So para o reteste do SQLi SEM o WAF (prova que a correcao esta na causa
      # raiz). Operadores usam a porta 8080 (WAF).
      - "127.0.0.1:8090:8080"

  # Camada adicional (defesa em profundidade, RT-08): WAF ModSecurity + OWASP CRS
  # na frente do painel. Bloqueia padroes de SQLi antes de chegarem ao app.
  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-alpine-202611090911-lts
    environment:
      BACKEND: http://painel:8080
      PORT: "8080"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG: /var/log/vila/waf_audit.json
      TZ: UTC
    volumes:
      - ./logs:/var/log/vila
    depends_on: [painel]
    networks: [operadores]
    ports:
      - "127.0.0.1:8080:8080"

  # Versao VULNERAVEL do painel (o "antes" do RT-08). Profile separado: nunca
  # sobe por padrao. Usa o owner do banco (privilegio excessivo, como no legado).
  painel-vulneravel:
    profiles: ["vulneravel"]
    build:
      context: ./nuvem/painel
      dockerfile: Dockerfile.vulneravel
    environment:
      PAINEL_DB_DSN_LEGADO: "postgresql://vila_owner:${PG_OWNER_PASSWORD}@postgres:5432/vila"
      TZ: UTC
    volumes:
      - ./logs:/var/log/vila
    depends_on: [postgres]
    networks: [dados, operadores]
    ports:
      - "127.0.0.1:8081:8081"

  # ------------------------------------------------------------------- SIEM
  # Wazuh manager: le os logs centralizados em ./logs (montado so leitura),
  # aplica siem/local_rules.xml e grava os alertas em alerts.json.
  wazuh:
    image: wazuh/wazuh-manager:4.9.0
    profiles: ["siem"]
    hostname: wazuh-manager
    environment:
      # horario local da Vila Aurora: as regras de "fora do horario" usam este fuso
      TZ: America/Sao_Paulo
    volumes:
      - ./logs:/var/log/vila:ro
      - ./siem:/siem:ro
    networks: [admin]

networks:
  iot:
  wan:
  dados:
    internal: true
  operadores:
  admin:
    internal: true

volumes:
  pgdata:
  borda_buffer:
